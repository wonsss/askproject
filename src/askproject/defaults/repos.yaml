# 레포 레지스트리. 기준 ref를 바꾸면(예: 릴리스 태그) 답변 기준 버전이 바뀐다.
defaults:
  exclude:
    - "**/.env*"
    - "**/pnpm-lock.yaml"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/*.{png,jpg,jpeg,gif,webp,ico,svg,otf,ttf,woff,woff2,tgz,zip,pdf,lottie,mp4,mov}"
    - "**/dist/**"
    - "**/build/**"
    - "**/node_modules/**"
  include_exceptions:
    - "**/.env.example"

repos: []
# 아래 형식으로 대상 레포를 채운다 (현재 PoC는 첫 번째 레포만 사용).
