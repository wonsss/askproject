# askproject config set이 쓴 파일입니다. 앱 설정 화면에서 바꾸세요.
defaults:
  exclude:
  - '**/.env*'
  - '**/pnpm-lock.yaml'
  - '**/package-lock.json'
  - '**/yarn.lock'
  - '**/*.{png,jpg,jpeg,gif,webp,ico,svg,otf,ttf,woff,woff2,tgz,zip,pdf,lottie,mp4,mov}'
  - '**/dist/**'
  - '**/build/**'
  - '**/node_modules/**'
  include_exceptions:
  - '**/.env.example'
repos: []
