# gitleaks 설정: 기본 규칙 + 테스트에 쓰는 가짜 토큰만 허용한다.
# 비공개 대상 레포 이름 같은 "공개되면 안 되는 문자열" 규칙은 여기 두지 않는다(규칙 자체가 그 이름을 공개한다).
# 그런 규칙은 레포 밖 파일에 두고 로컬 pre-push 훅이 읽는다 — CONTRIBUTING.md 참고.
[extend]
useDefault = true

[[allowlists]]
description = "테스트용 가짜 토큰(실제 값 아님)"
paths = ['''^tests/''']
regexes = [
  '''xoxb-123-456-secret''',
  '''xoxb-1-2-abc''',
  '''sk-ant-(api03-abc_DEF|from-keychain|from-shell|leak)''',
  '''github_pat_(11ABC|T|X)\b''',
]
