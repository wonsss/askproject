# 비밀값 검사: push·PR마다 이력 전체를 gitleaks(기본 규칙 + .gitleaks.toml)로 본다. 비밀값 없음.
# 비공개 대상 레포 이름 같은 규칙은 공개 설정에 둘 수 없어 로컬 pre-push 훅이 맡는다(CONTRIBUTING.md).
name: secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  # linux_x64 tarball
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 설치 (버전·sha256 고정)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f" -o "$RUNNER_TEMP/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: 이력 전체 검사
        run: |
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --config .gitleaks.toml
