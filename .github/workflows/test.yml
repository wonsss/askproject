# 백엔드 테스트: push·PR마다 리눅스에서 pytest. 비밀값·API 비용 없음.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 공개 위생 — config/*.yaml은 git에 넣지 않는다
        # 서비스마다 채우는 파일(비공개 레포 정보)이라 .gitignore로 뺐다. 템플릿은 src/askproject/defaults/에 둔다.
        run: |
          tracked=$(git ls-files 'config/*.yaml')
          if [ -n "$tracked" ]; then
            echo "::error::config/*.yaml이 커밋됐어요(서비스 정보 유출 위험): $tracked — git rm --cached로 빼고 템플릿은 defaults/를 고치세요"
            exit 1
          fi
      - name: ripgrep (code_search 도구 테스트에 필요)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - run: uv run pytest -q
