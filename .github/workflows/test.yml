# 백엔드 테스트: push·PR마다 리눅스에서 pytest. 비밀값·API 비용 없음.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 공개 위생 — 커밋된 config/*.yaml은 빈 템플릿이어야 한다
        # 개발 모드 config set이 추적 중인 config/에 대상 레포 정보를 쓰므로, 실수로 커밋되면 여기서 막는다.
        run: |
          for f in repos domains glossary; do
            cmp -s "config/$f.yaml" "src/askproject/defaults/$f.yaml" \
              || { echo "::error file=config/$f.yaml::채운 설정이 커밋됐어요 — src/askproject/defaults/$f.yaml과 같아야 합니다"; exit 1; }
          done
      - name: ripgrep (code_search 도구 테스트에 필요)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - run: uv run pytest -q
